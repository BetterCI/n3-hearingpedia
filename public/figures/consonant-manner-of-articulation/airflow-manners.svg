   <g id="text_1">
    <text style="font-weight: 700; font-size: 42px; font-family: 'Microsoft YaHei', 'DejaVu Sans'; text-anchor: start; fill: #203040" x="55" y="73.566406" transform="rotate(-0 55 73.566406)">阻塞、释放与气流通路</text>
   </g>
   <g id="text_2">
    <text style="font-size: 27px; font-family: 'Microsoft YaHei', 'DejaVu Sans'; text-anchor: start; fill: #7c8792" x="55" y="125.435547" transform="rotate(-0 55 125.435547)">（a）（b）看闭塞怎样释放；（c）看狭窄；（d）（e）看通气路线</text>
   </g>
   <g id="text_3">
    <text style="font-weight: 700; font-size: 33px; font-family: 'Microsoft YaHei', 'DejaVu Sans'; text-anchor: start; fill: #203040" x="65" y="276.087891" transform="rotate(-0 65 276.087891)">（a）塞音</text>
   </g>
   <g id="text_4">
    <text style="font-size: 35px; font-family: 'Microsoft YaHei', 'DejaVu Sans'; text-anchor: middle; fill: #203040" x="490" y="281.638672" transform="rotate(-0 490 281.638672)">完全闭塞</text>
   </g>
   <g id="text_5">
    <text style="font-size: 35px; font-family: 'Microsoft YaHei', 'DejaVu Sans'; text-anchor: middle; fill: #203040" x="925" y="281.638672" transform="rotate(-0 925 281.638672)">随后释放</text>
   </g>
   <g id="text_6">
    <text style="font-size: 29px; font-family: 'Microsoft YaHei', 'DejaVu Sans'; text-anchor: start; fill: #203040" x="730" y="357" transform="rotate(-0 730 357)">鼻腔通常关闭</text>
   </g>
   <g id="text_7">
    <text style="font-weight: 700; font-size: 33px; font-family: 'Microsoft YaHei', 'DejaVu Sans'; text-anchor: start; fill: #203040" x="65" y="441.087891" transform="rotate(-0 65 441.087891)">（b）塞擦音</text>
   </g>
   <g id="text_8">
    <text style="font-size: 35px; font-family: 'Microsoft YaHei', 'DejaVu Sans'; text-anchor: middle; fill: #203040" x="490" y="446.638672" transform="rotate(-0 490 446.638672)">完全闭塞</text>
   </g>
   <g id="text_9">
    <text style="font-size: 35px; font-family: 'Microsoft YaHei', 'DejaVu Sans'; text-anchor: middle; fill: #203040" x="925" y="446.638672" transform="rotate(-0 925 446.638672)">窄通道摩擦释放</text>
   </g>
   <g id="text_10">
    <text style="font-size: 29px; font-family: 'Microsoft YaHei', 'DejaVu Sans'; text-anchor: start; fill: #203040" x="730" y="522" transform="rotate(-0 730 522)">闭塞与摩擦紧密相连</text>
   </g>
   <g id="text_11">
    <text style="font-weight: 700; font-size: 33px; font-family: 'Microsoft YaHei', 'DejaVu Sans'; text-anchor: start; fill: #203040" x="65" y="606.087891" transform="rotate(-0 65 606.087891)">（c）擦音</text>
   </g>
   <g id="text_12">
    <text style="font-size: 35px; font-family: 'Microsoft YaHei', 'DejaVu Sans'; text-anchor: middle; fill: #203040" x="490" y="611.638672" transform="rotate(-0 490 611.638672)">保持狭窄</text>
   </g>
   <g id="text_13">
    <text style="font-size: 35px; font-family: 'Microsoft YaHei', 'DejaVu Sans'; text-anchor: middle; fill: #203040" x="925" y="611.638672" transform="rotate(-0 925 611.638672)">持续口腔摩擦</text>
   </g>
   <g id="text_14">
    <text style="font-size: 29px; font-family: 'Microsoft YaHei', 'DejaVu Sans'; text-anchor: start; fill: #203040" x="730" y="687" transform="rotate(-0 730 687)">不要求起始完全闭塞</text>
   </g>
   <g id="text_15">
    <text style="font-weight: 700; font-size: 33px; font-family: 'Microsoft YaHei', 'DejaVu Sans'; text-anchor: start; fill: #203040" x="65" y="771.087891" transform="rotate(-0 65 771.087891)">（d）鼻音</text>
   </g>
   <g id="text_16">
    <text style="font-size: 35px; font-family: 'Microsoft YaHei', 'DejaVu Sans'; text-anchor: middle; fill: #203040" x="490" y="776.638672" transform="rotate(-0 490 776.638672)">口腔闭塞</text>
   </g>
   <g id="text_17">
    <text style="font-size: 35px; font-family: 'Microsoft YaHei', 'DejaVu Sans'; text-anchor: middle; fill: #203040" x="925" y="776.638672" transform="rotate(-0 925 776.638672)">鼻腔通路开放</text>
   </g>
   <g id="text_18">
    <text style="font-size: 29px; font-family: 'Microsoft YaHei', 'DejaVu Sans'; text-anchor: start; fill: #203040" x="730" y="852" transform="rotate(-0 730 852)">软腭下降，气流经鼻腔</text>
   </g>
   <g id="text_19">
    <text style="font-weight: 700; font-size: 33px; font-family: 'Microsoft YaHei', 'DejaVu Sans'; text-anchor: start; fill: #203040" x="65" y="936.087891" transform="rotate(-0 65 936.087891)">（e）边音</text>
   </g>
   <g id="text_20">
    <text style="font-size: 35px; font-family: 'Microsoft YaHei', 'DejaVu Sans'; text-anchor: middle; fill: #203040" x="490" y="941.638672" transform="rotate(-0 490 941.638672)">口腔中央阻碍</text>
   </g>
   <g id="text_21">
    <text style="font-size: 35px; font-family: 'Microsoft YaHei', 'DejaVu Sans'; text-anchor: middle; fill: #203040" x="925" y="941.638672" transform="rotate(-0 925 941.638672)">舌侧通路保留</text>
   </g>
   <g id="text_22">
    <text style="font-size: 29px; font-family: 'Microsoft YaHei', 'DejaVu Sans'; text-anchor: start; fill: #203040" x="730" y="1017" transform="rotate(-0 730 1017)">l 主要经口腔侧向通气</text>
   </g>
   <g id="text_23">
    <text style="font-size: 27px; font-family: 'Microsoft YaHei', 'DejaVu Sans'; text-anchor: start; fill: #7c8792" x="65" y="1085" transform="rotate(-0 65 1085)">箭头表示过程或通气条件的联系，不表示解剖位置、流速或持续时间。</text>
   </g>
   <g id="text_24">
    <text style="font-size: 28px; font-family: 'Microsoft YaHei', 'DejaVu Sans'; text-anchor: start; fill: #7c8792" x="65" y="1150" transform="rotate(-0 65 1150)">（d）（e）是同时成立的通气条件，并非先后动作。</text>
   </g>
  </g>
