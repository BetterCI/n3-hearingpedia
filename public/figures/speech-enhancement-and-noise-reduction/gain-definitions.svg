   <text style="fill: #26384b; font: 700 25px 'Microsoft YaHei', 'DejaVu Sans'; text-anchor: start" x="70.56" y="45.184375" transform="rotate(-0 70.56 45.184375)">同一个功率比，可以定义不同的幅度增益</text>
