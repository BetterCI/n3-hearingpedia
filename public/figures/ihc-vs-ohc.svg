<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650">
<title>内毛细胞与外毛细胞功能分工</title>
<rect width="1200" height="650" fill="white"/>
<g font-family="Arial, Noto Sans CJK SC, sans-serif" fill="#111">
<text x="55" y="48" font-size="28" font-weight="700">IHC 与 OHC：同为毛细胞，但承担完全不同的核心任务</text>
<text x="55" y="82" font-size="18">外毛细胞主要改变耳蜗机械输入；内毛细胞主要把机械信息转成传入神经信号。</text>
</g>
<g font-family="Arial, Noto Sans CJK SC, sans-serif" stroke="#222" stroke-width="2">
<g fill="white">
<rect x="80" y="135" width="460" height="390" rx="18"/>
<rect x="660" y="135" width="460" height="390" rx="18"/>
</g>
<g fill="#111" stroke="none">
<text x="310" y="180" font-size="26" font-weight="700" text-anchor="middle">Inner Hair Cell · IHC</text>
<text x="890" y="180" font-size="26" font-weight="700" text-anchor="middle">Outer Hair Cell · OHC</text>
<text x="120" y="230" font-size="20">• 一行，位于螺旋器内侧</text>
<text x="120" y="270" font-size="20">• 主要传入感觉受体</text>
<text x="120" y="310" font-size="20">• 连接约 95% 的听神经传入纤维</text>
<text x="120" y="350" font-size="20">• MET → receptor potential</text>
<text x="120" y="390" font-size="20">• CaV1.3 → ribbon → glutamate</text>
<text x="120" y="430" font-size="20">• 输出 rate / timing / intensity code</text>
<text x="120" y="470" font-size="20">• OTOF、synaptopathy 与 auditory neuropathy 核心</text>
<text x="700" y="230" font-size="20">• 三行，位于螺旋器外侧</text>
<text x="700" y="270" font-size="20">• 主动机械反馈与 cochlear amplifier</text>
<text x="700" y="310" font-size="20">• prestin-mediated electromotility</text>
<text x="700" y="350" font-size="20">• 改善低声级灵敏度</text>
<text x="700" y="390" font-size="20">• 锐化频率调谐</text>
<text x="700" y="430" font-size="20">• 参与压缩性非线性</text>
<text x="700" y="470" font-size="20">• 损伤后常见阈值升高与频率选择性下降</text>
</g>
</g>
<g font-family="Arial, Noto Sans CJK SC, sans-serif" fill="#111" font-size="18">
<text x="80" y="580">教学要点：不能把“毛细胞损伤”当成单一机制。OHC 损伤与 IHC/突触损伤即使产生相似听力图，也可能留下不同的阈上听觉后果。</text>
<text x="80" y="615">Hearingpedia 原创教学图。</text>
</g>
</svg>