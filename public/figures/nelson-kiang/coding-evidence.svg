<svg xmlns="http://www.w3.org/2000/svg" width="960" height="510" viewBox="0 0 960 510" role="img"><title>神经编码研究的三种问题</title><rect width="960" height="510" fill="white"/><g font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="35" y="42" font-size="30" fill="#26334b">从脉冲记录到听觉解释</text><text x="35" y="75" font-size="19" fill="#66758a">本站原创阅读图｜三种问题需要不同证据</text><rect x="35" y="108" width="890" height="96" rx="14" fill="#f5f7fb" stroke="#d8e1ed"/><text x="53" y="146" font-size="24" fill="#315bc6">记录中有什么？</text><text x="320" y="143" font-size="21" fill="#26334b">调谐曲线、平均率、放电时序</text><text x="320" y="178" font-size="19" fill="#66758a">单纤维生理数据；明确刺激与记录部位</text><rect x="35" y="218" width="890" height="96" rx="14" fill="#f5f7fb" stroke="#d8e1ed"/><text x="53" y="256" font-size="24" fill="#315bc6">这些线索能做什么？</text><text x="320" y="253" font-size="21" fill="#26334b">区分频率、共振峰或时间变化</text><text x="320" y="288" font-size="19" fill="#66758a">分析或解码模型；说明可用信息及假设</text><rect x="35" y="328" width="890" height="96" rx="14" fill="#f5f7fb" stroke="#d8e1ed"/><text x="53" y="366" font-size="24" fill="#315bc6">听者实际用了什么？</text><text x="320" y="363" font-size="21" fill="#26334b">听觉任务、阈值与错误模式</text><text x="320" y="398" font-size="19" fill="#66758a">行为检验及有针对性的操纵</text><text x="35" y="475" font-size="20" fill="#26334b">神经响应里存在可解码线索，不自动证明人脑采用了同一种解码方式。</text></g></svg>