<svg xmlns="http://www.w3.org/2000/svg" width="960" height="490" viewBox="0 0 960 490" role="img"><title>相同平均率与不同相位分布的教学示例</title><rect width="960" height="490" fill="white"/><g font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="35" y="42" font-size="30" fill="#26334b">平均率相同，时序仍可不同</text><text x="35" y="75" font-size="19" fill="#a55425">本站假设数据｜每组8个脉冲，观察窗100 ms｜非论文实测数据</text><circle cx="260" cy="245" r="110" fill="#f5f7fb" stroke="#cbd5e5"/><path d="M260 245L370 245" stroke="#cad3e1" stroke-width="1" fill="none"/><path d="M260 245L337.78174593052023 167.21825406947977" stroke="#cad3e1" stroke-width="1" fill="none"/><path d="M260 245L260 135" stroke="#cad3e1" stroke-width="1" fill="none"/><path d="M260 245L182.21825406947977 167.21825406947977" stroke="#cad3e1" stroke-width="1" fill="none"/><path d="M260 245L150 245" stroke="#cad3e1" stroke-width="1" fill="none"/><path d="M260 245L182.21825406947977 322.78174593052023" stroke="#cad3e1" stroke-width="1" fill="none"/><path d="M260 245L260 355" stroke="#cad3e1" stroke-width="1" fill="none"/><path d="M260 245L337.7817459305202 322.78174593052023" stroke="#cad3e1" stroke-width="1" fill="none"/><circle cx="365" cy="245" r="5" fill="#315bc6"/><circle cx="359" cy="245" r="5" fill="#315bc6"/><circle cx="353" cy="245" r="5" fill="#315bc6"/><circle cx="347" cy="245" r="5" fill="#315bc6"/><circle cx="341" cy="245" r="5" fill="#315bc6"/><circle cx="335" cy="245" r="5" fill="#315bc6"/><circle cx="329" cy="245" r="5" fill="#315bc6"/><circle cx="323" cy="245" r="5" fill="#315bc6"/><text x="125" y="390" font-size="23" fill="#315bc6">固定相位：VS = 1</text><text x="140" y="420" font-size="20" fill="#26334b">平均率都为80 spikes/s</text><circle cx="700" cy="245" r="110" fill="#f5f7fb" stroke="#cbd5e5"/><path d="M700 245L810 245" stroke="#cad3e1" stroke-width="1" fill="none"/><path d="M700 245L777.7817459305202 167.21825406947977" stroke="#cad3e1" stroke-width="1" fill="none"/><path d="M700 245L700 135" stroke="#cad3e1" stroke-width="1" fill="none"/><path d="M700 245L622.2182540694798 167.21825406947977" stroke="#cad3e1" stroke-width="1" fill="none"/><path d="M700 245L590 245" stroke="#cad3e1" stroke-width="1" fill="none"/><path d="M700 245L622.2182540694797 322.78174593052023" stroke="#cad3e1" stroke-width="1" fill="none"/><path d="M700 245L700 355" stroke="#cad3e1" stroke-width="1" fill="none"/><path d="M700 245L777.7817459305202 322.78174593052023" stroke="#cad3e1" stroke-width="1" fill="none"/><circle cx="810" cy="245" r="5" fill="#b36825"/><circle cx="777.7817459305202" cy="167.21825406947977" r="5" fill="#b36825"/><circle cx="700" cy="135" r="5" fill="#b36825"/><circle cx="622.2182540694798" cy="167.21825406947977" r="5" fill="#b36825"/><circle cx="590" cy="245" r="5" fill="#b36825"/><circle cx="622.2182540694797" cy="322.78174593052023" r="5" fill="#b36825"/><circle cx="700" cy="355" r="5" fill="#b36825"/><circle cx="777.7817459305202" cy="322.78174593052023" r="5" fill="#b36825"/><text x="565" y="390" font-size="23" fill="#b36825">均匀相位：VS = 0</text><text x="580" y="420" font-size="20" fill="#26334b">平均率都为80 spikes/s</text><text x="35" y="464" font-size="19" fill="#26334b">圆周表示刺激相位；固定相位的圆点沿半径错开，仅为避免重叠。</text></g></svg>