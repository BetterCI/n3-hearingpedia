<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="540" viewBox="0 0 1280 540" role="img" aria-labelledby="title desc">
<title id="title">合成语音评价的三个互补结果</title><desc id="desc">从受控语音输入分别测量辨认、自然度和混淆，不合成为通用总分。</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,3 L0,6" fill="#6c8291"/></marker></defs>
<rect width="1280" height="540" fill="white"/>
<g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><text x="50" y="58" font-size="34" fill="#243648" text-anchor="start" font-weight="600">合成语音：测量表现，也定位问题</text><text x="50" y="100" font-size="25" fill="#526778" text-anchor="start" font-weight="400">控制材料、重放和听者条件，分别记录三个评价结果</text><rect x="50" y="165" width="310" height="200" rx="12" fill="#f1f6f9" stroke="#b7c9d4" stroke-width="2"/><text x="205" y="223" font-size="29" fill="#296b91" text-anchor="middle" font-weight="600">规定测试条件</text><text x="205" y="272" font-size="25" fill="#243648" text-anchor="middle" font-weight="400">同一组语音材料</text><text x="205" y="315" font-size="24" fill="#243648" text-anchor="middle" font-weight="400">系统与自然语音对照</text><path d="M370,265 L465,180" stroke="#6c8291" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="480" y="140" width="750" height="90" rx="12" fill="#f1f6f9" stroke="#b7c9d4" stroke-width="2"/><text x="505" y="176" font-size="28" fill="#296b91" text-anchor="start" font-weight="600">听写与正确率</text><text x="505" y="212" font-size="24" fill="#243648" text-anchor="start" font-weight="400">记录辨认出的语言单位</text><path d="M370,265 L465,293" stroke="#6c8291" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="480" y="253" width="750" height="90" rx="12" fill="#f1f6f9" stroke="#b7c9d4" stroke-width="2"/><text x="505" y="289" font-size="28" fill="#296b91" text-anchor="start" font-weight="600">自然度评分</text><text x="505" y="325" font-size="24" fill="#243648" text-anchor="start" font-weight="400">明确量表刻度与文字锚点</text><path d="M370,265 L465,406" stroke="#6c8291" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="480" y="366" width="750" height="90" rx="12" fill="#f1f6f9" stroke="#b7c9d4" stroke-width="2"/><text x="505" y="402" font-size="28" fill="#296b91" text-anchor="start" font-weight="600">混淆与层次比较</text><text x="505" y="438" font-size="24" fill="#243648" text-anchor="start" font-weight="400">保留错误去向，形成诊断假设</text><text x="50" y="508" font-size="24" fill="#526778" text-anchor="start" font-weight="400">原创教学功能图｜不同结果分别解释；诊断假设还需后续实验检验</text></g></svg>
