<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="600" viewBox="0 0 1280 600" role="img" aria-labelledby="title desc">
<title id="title">信号、语言结构与听者反应</title><desc id="desc">由代表论文整理的研究框架，非神经通路图。</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,3 L0,6" fill="#6c8291"/></marker></defs>
<rect width="1280" height="600" fill="white"/>
<g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><text x="50" y="58" font-size="34" fill="#243648" text-anchor="start" font-weight="600">从物理信号到听者反应</text><text x="50" y="100" font-size="25" fill="#526778" text-anchor="start" font-weight="400">三个对象分别描述，再建立可以检验的联系</text><rect x="50" y="146" width="360" height="200" rx="12" fill="#f1f6f9" stroke="#b7c9d4" stroke-width="2"/><text x="230" y="193" font-size="30" fill="#296b91" text-anchor="middle" font-weight="600">声学信号</text><text x="230" y="241" font-size="24" fill="#243648" text-anchor="middle" font-weight="400">频谱 · 时长 · 周期变化</text><text x="230" y="282" font-size="24" fill="#243648" text-anchor="middle" font-weight="400">刺激与传输条件</text><text x="230" y="324" font-size="22" fill="#526778" text-anchor="middle" font-weight="400">测量声音保留了什么</text><path d="M230,353 L230,405" stroke="#6c8291" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="460" y="146" width="360" height="200" rx="12" fill="#f1f6f9" stroke="#b7c9d4" stroke-width="2"/><text x="640" y="193" font-size="30" fill="#296b91" text-anchor="middle" font-weight="600">语言结构</text><text x="640" y="241" font-size="24" fill="#243648" text-anchor="middle" font-weight="400">声母 · 韵母 · 声调</text><text x="640" y="282" font-size="24" fill="#243648" text-anchor="middle" font-weight="400">合法组合与候选类别</text><text x="640" y="324" font-size="22" fill="#526778" text-anchor="middle" font-weight="400">说明计分单位和约束</text><path d="M640,353 L640,405" stroke="#6c8291" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="870" y="146" width="360" height="200" rx="12" fill="#f1f6f9" stroke="#b7c9d4" stroke-width="2"/><text x="1050" y="193" font-size="30" fill="#296b91" text-anchor="middle" font-weight="600">听者反应</text><text x="1050" y="241" font-size="24" fill="#243648" text-anchor="middle" font-weight="400">正确 · 混淆 · 自然度</text><text x="1050" y="282" font-size="24" fill="#243648" text-anchor="middle" font-weight="400">任务、选项与个体条件</text><text x="1050" y="324" font-size="22" fill="#526778" text-anchor="middle" font-weight="400">观察听者实际报告什么</text><path d="M1050,353 L1050,405" stroke="#6c8291" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="50" y="413" width="1180" height="95" rx="12" fill="#f8f5ef" stroke="#d7c7b5" stroke-width="2"/><text x="640" y="454" font-size="29" fill="#243648" text-anchor="middle" font-weight="600">清晰度的统计关系  →  混淆与知觉空间  →  语音系统评价</text><text x="640" y="490" font-size="24" fill="#526778" text-anchor="middle" font-weight="400">分析用途可以互补，结论需回到原来的材料与任务检验</text><text x="50" y="565" font-size="23" fill="#526778" text-anchor="start" font-weight="400">原创教学框图｜不表示神经通路或一套同名历史模型</text></g></svg>
