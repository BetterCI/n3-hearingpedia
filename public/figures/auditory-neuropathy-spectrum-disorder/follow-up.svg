   <g id="text_1">
    <text style="fill: #22344b; font: 16px 'Microsoft YaHei'" transform="translate(222.52 159.38875)">生理证据</text>
    <text style="fill: #22344b; font: 16px 'Microsoft YaHei'" transform="translate(169.04375 183.83025)">中耳、OAE／CM、ABR</text>
    <text style="fill: #22344b; font: 16px 'Microsoft YaHei'" transform="translate(174.52 208.27175)">记录可靠性与复测变化</text>
   </g>
   <g id="text_2">
    <text style="fill: #22344b; font: 16px 'Microsoft YaHei'" transform="translate(713.48 159.38875)">病因与结构</text>
    <text style="fill: #22344b; font: 16px 'Microsoft YaHei'" transform="translate(665.48 183.83025)">围产史、遗传、神经系统</text>
    <text style="fill: #22344b; font: 16px 'Microsoft YaHei'" transform="translate(681.48 208.27175)">必要的耳蜗神经影像</text>
   </g>
   <g id="text_3">
    <text style="fill: #22344b; font: 16px 'Microsoft YaHei'" transform="translate(222.52 339.31675)">听觉功能</text>
    <text style="fill: #22344b; font: 16px 'Microsoft YaHei'" transform="translate(158.52 363.75825)">行为听阈、安静与噪声言语</text>
    <text style="fill: #22344b; font: 16px 'Microsoft YaHei'" transform="translate(182.52 388.19975)">设备验证和实际使用</text>
   </g>
   <g id="text_4">
    <text style="fill: #22344b; font: 16px 'Microsoft YaHei'" transform="translate(713.48 339.31675)">交流与发展</text>
    <text style="fill: #22344b; font: 16px 'Microsoft YaHei'" transform="translate(689.48 363.75825)">可及的口语／手语</text>
    <text style="fill: #22344b; font: 16px 'Microsoft YaHei'" transform="translate(673.48 388.19975)">语言、参与和家庭目标</text>
   </g>
