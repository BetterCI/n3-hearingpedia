<svg xmlns="http://www.w3.org/2000/svg" width="960" height="500" viewBox="0 0 960 500" role="img"><title>不同研究方法的证据范围</title><rect width="960" height="500" fill="white"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><text x="35" y="45" font-size="29" fill="#26334b">方法不同，能回答的问题也不同</text><text x="35" y="77" font-size="19" fill="#66758a">阅读证据时，保留任务、对象与解释层次</text><rect x="35" y="100" width="890" height="63" rx="14" fill="#f4f7fc" stroke="#d9e2ef"/><text x="53" y="139" font-size="22" fill="#315bc6">行为操纵</text><text x="225" y="125" font-size="19" fill="#26334b">改变声音条件 → 比较任务表现</text><text x="225" y="150" font-size="18" fill="#66758a">支持条件作用，不能独自定位脑区</text><rect x="35" y="172" width="890" height="63" rx="14" fill="#f4f7fc" stroke="#d9e2ef"/><text x="53" y="211" font-size="22" fill="#315bc6">跨任务相关</text><text x="225" y="197" font-size="19" fill="#26334b">同一听者的不同指标相互联系</text><text x="225" y="222" font-size="18" fill="#66758a">提示联系，不证明唯一因果链</text><rect x="35" y="244" width="890" height="63" rx="14" fill="#f4f7fc" stroke="#d9e2ef"/><text x="53" y="283" font-size="22" fill="#315bc6">神经记录</text><text x="225" y="269" font-size="19" fill="#26334b">观察响应与声音、行为的关系</text><text x="225" y="294" font-size="18" fill="#66758a">响应变化不自动等于识别改善</text><rect x="35" y="316" width="890" height="63" rx="14" fill="#f4f7fc" stroke="#d9e2ef"/><text x="53" y="355" font-size="22" fill="#315bc6">可逆干预</text><text x="225" y="341" font-size="19" fill="#26334b">改变局部功能，再看反应与恢复</text><text x="225" y="366" font-size="18" fill="#66758a">支持功能依赖，仍需网络与基线对照</text><rect x="35" y="388" width="890" height="63" rx="14" fill="#f4f7fc" stroke="#d9e2ef"/><text x="53" y="427" font-size="22" fill="#315bc6">临床比较</text><text x="225" y="413" font-size="19" fill="#26334b">疾病或手术背景下比较表现</text><text x="225" y="438" font-size="18" fill="#66758a">需要控制可听度和其他背景差异</text><text x="35" y="482" font-size="19" fill="#26334b">这是方法阅读图，不是把研究排成统一的证据强弱分数。</text></g></svg>