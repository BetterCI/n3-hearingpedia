<svg xmlns="http://www.w3.org/2000/svg" width="960" height="480" viewBox="0 0 960 480" role="img"><title>三种范式：操纵、任务与指标</title><rect width="960" height="480" fill="white"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><text x="35" y="48" font-size="30" fill="#26334b">三种任务，三类指标</text><text x="35" y="80" font-size="18" fill="#66758a">范式概念对照｜不表示同一实验装置或相同刺激参数</text><rect x="35" y="112" width="280" height="305" rx="14" fill="#f4f7fc" stroke="#d9e2ef"/><text x="53" y="155" font-size="24" fill="#315bc6">语音去掩蔽</text><text x="53" y="205" font-size="19" fill="#26334b">操纵：目标与干扰声像</text><text x="53" y="257" font-size="19" fill="#26334b">任务：复述目标语句</text><text x="53" y="309" font-size="19" fill="#26334b">指标：关键词识别表现</text><text x="53" y="361" font-size="17" fill="#26334b">问题：是否更容易选出目标？</text><rect x="335" y="112" width="280" height="305" rx="14" fill="#f4f7fc" stroke="#d9e2ef"/><text x="353" y="155" font-size="24" fill="#315bc6">短暂声学信息保留</text><text x="353" y="205" font-size="19" fill="#26334b">操纵：双耳关系与延迟</text><text x="353" y="257" font-size="19" fill="#26334b">任务：检测相关性中断</text><text x="353" y="309" font-size="19" fill="#26334b">指标：任务阈值（毫秒）</text><text x="353" y="361" font-size="17" fill="#26334b">问题：能否跨时间比较输入？</text><rect x="635" y="112" width="280" height="305" rx="14" fill="#f4f7fc" stroke="#d9e2ef"/><text x="653" y="155" font-size="24" fill="#315bc6">前脉冲抑制</text><text x="653" y="205" font-size="19" fill="#26334b">操纵：学习、分离、干预</text><text x="653" y="257" font-size="19" fill="#26334b">任务：记录动物惊跳反应</text><text x="653" y="309" font-size="19" fill="#26334b">指标：相对抑制比例</text><text x="653" y="361" font-size="17" fill="#26334b">问题：门控怎样受到调节？</text><text x="35" y="452" font-size="20" fill="#26334b">识别率、检测阈值与惊跳抑制不能互相替代。</text></g></svg>