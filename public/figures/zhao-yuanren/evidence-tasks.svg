<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img"><title>声学分析、声调识别与语气判断的证据范围</title><rect width="960" height="540" fill="white"/><g font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="35" y="45" font-size="30" fill="#25334d">同一录音，三个问题</text><text x="35" y="82" font-size="19" fill="#9b5a2b">本站教学图｜没有虚构正确率；不同输出不能互相替代</text><text x="50" y="128" font-size="20" fill="#25334d">任务</text><text x="270" y="128" font-size="20" fill="#25334d">输出</text><text x="610" y="128" font-size="20" fill="#25334d">解释范围</text><rect x="35" y="150" width="890" height="88" rx="14" fill="#f4f7fc" stroke="#d4deec"/><text x="50" y="185" font-size="23" fill="#315bc6">声学分析</text><text x="270" y="185" font-size="22" fill="#25334d">基频、时长、发声特征</text><text x="610" y="182" font-size="20" fill="#25334d">声音怎样变化</text><text x="610" y="215" font-size="18" fill="#25334d">不直接给出识别能力</text><rect x="35" y="253" width="890" height="88" rx="14" fill="#f4f7fc" stroke="#d4deec"/><text x="50" y="288" font-size="23" fill="#315bc6">声调识别</text><text x="270" y="288" font-size="22" fill="#25334d">听者选择声调类别</text><text x="610" y="285" font-size="20" fill="#25334d">在指定任务中怎样归类</text><text x="610" y="318" font-size="18" fill="#25334d">需定义材料和响应选项</text><rect x="35" y="356" width="890" height="88" rx="14" fill="#f4f7fc" stroke="#d4deec"/><text x="50" y="391" font-size="23" fill="#315bc6">语气／情绪判断</text><text x="270" y="391" font-size="22" fill="#25334d">听者选择语气或情绪</text><text x="610" y="388" font-size="20" fill="#25334d">表达信息怎样被判断</text><text x="610" y="421" font-size="18" fill="#25334d">需保留语言与语境条件</text><text x="35" y="502" font-size="23" fill="#25334d">典型标调 ≠ 每次发音轨迹 ≠ 每位听者的判断。</text></g></svg>