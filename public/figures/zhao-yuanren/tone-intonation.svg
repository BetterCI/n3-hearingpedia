<svg xmlns="http://www.w3.org/2000/svg" width="960" height="590" viewBox="0 0 960 590" role="img"><title>同时改变词调与词调后增加语调尾部</title><rect width="960" height="590" fill="white"/><g font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="35" y="45" font-size="30" fill="#25334d">字调与语调：两种时间关系</text><text x="35" y="82" font-size="19" fill="#9b5a2b">本站假设曲线｜不是原文测量，也不是所有问句的固定模式</text><rect x="35" y="115" width="430" height="355" rx="14" fill="#f4f7fc" stroke="#d4deec"/><rect x="495" y="115" width="430" height="355" rx="14" fill="#f4f7fc" stroke="#d4deec"/><text x="55" y="155" font-size="25" fill="#25334d">同一时段改变水平与音域</text><text x="515" y="155" font-size="25" fill="#25334d">词调结束后增加尾部</text><path d="M75 415L435 415" stroke="#a0afc3" stroke-width="2" fill="none"/><path d="M75 210L75 415" stroke="#a0afc3" stroke-width="2" fill="none"/><path d="M535 415L900 415" stroke="#a0afc3" stroke-width="2" fill="none"/><path d="M535 210L535 415" stroke="#a0afc3" stroke-width="2" fill="none"/><polyline points="90,245 390,360" fill="none" stroke="#315bc6" stroke-width="4" stroke-linejoin="round"/><polyline points="90,220 390,295" fill="none" stroke="#b66b2d" stroke-width="4" stroke-linejoin="round"/><polyline points="550,245 770,360" fill="none" stroke="#315bc6" stroke-width="4" stroke-linejoin="round"/><polyline points="550,245 770,360 885,230" fill="none" stroke="#b66b2d" stroke-width="4" stroke-linejoin="round"/><path d="M770 205L770 410" stroke="#b8c4d5" stroke-width="1" fill="none"/><text x="692" y="435" font-size="18" fill="#25334d">词调结束</text><text x="100" y="455" font-size="18" fill="#25334d">同一段时间内的两条假设轨迹</text><text x="815" y="325" font-size="18" fill="#b66b2d">尾部</text><path d="M40 510L80 510" stroke="#315bc6" stroke-width="4" fill="none"/><text x="92" y="516" font-size="20" fill="#25334d">示意词调</text><path d="M270 510L310 510" stroke="#b66b2d" stroke-width="4" fill="none"/><text x="322" y="516" font-size="20" fill="#25334d">示意语调作用后的轨迹</text><text x="35" y="558" font-size="20" fill="#25334d">纵向仅表示相对高低；具体语言中的组合方式需要观察与实验。</text></g></svg>