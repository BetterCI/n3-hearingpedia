<svg xmlns="http://www.w3.org/2000/svg" width="960" height="550" viewBox="0 0 960 550" role="img"><title>普通平均与时变频带计权</title><rect width="960" height="550" fill="white"/><g font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="35" y="45" font-size="30" fill="#25334d">先平均，再按频带与时间计权</text><text x="35" y="80" font-size="19" fill="#9b5a2b">本站教学示意｜不是原论文算法的完整复现</text><rect x="35" y="115" width="190" height="85" rx="13" fill="#f4f7fc" stroke="#d4deec"/><text x="53" y="150" font-size="25" fill="#25334d">重复记录</text><text x="53" y="182" font-size="17" fill="#25334d">普通平均／噪声估计</text><text x="236" y="163" font-size="27" fill="#25334d">→</text><rect x="280" y="115" width="235" height="85" rx="13" fill="#f4f7fc" stroke="#d4deec"/><text x="298" y="150" font-size="25" fill="#25334d">分成多个频带</text><text x="298" y="182" font-size="18" fill="#25334d">各带分别估计功率</text><text x="526" y="163" font-size="27" fill="#25334d">→</text><rect x="565" y="115" width="345" height="85" rx="13" fill="#f4f7fc" stroke="#d4deec"/><text x="583" y="150" font-size="25" fill="#25334d">每个时刻选择权重</text><text x="583" y="182" font-size="18" fill="#25334d">加权后合成为输出</text><text x="35" y="250" font-size="24" fill="#25334d">单频带的简化功率示例</text><text x="35" y="283" font-size="22" fill="#315bc6">A = 1 − 噪声功率／混合功率</text><text x="50" y="328" font-size="19" fill="#25334d">时段</text><text x="235" y="328" font-size="19" fill="#25334d">混合功率</text><text x="405" y="328" font-size="19" fill="#25334d">噪声功率</text><text x="580" y="328" font-size="19" fill="#25334d">权重A</text><text x="720" y="328" font-size="19" fill="#25334d">解释</text><rect x="35" y="345" width="875" height="55" rx="13" fill="#f4f7fc" stroke="#d4deec"/><text x="50" y="380" font-size="21" fill="#25334d">反应时段</text><text x="235" y="380" font-size="21" fill="#25334d">10</text><text x="405" y="380" font-size="21" fill="#25334d">2</text><text x="580" y="380" font-size="21" fill="#25334d">0.8</text><text x="720" y="380" font-size="17" fill="#25334d">相应成分保留较多</text><rect x="35" y="410" width="875" height="55" rx="13" fill="#f4f7fc" stroke="#d4deec"/><text x="50" y="445" font-size="21" fill="#25334d">背景时段</text><text x="235" y="445" font-size="21" fill="#25334d">2</text><text x="405" y="445" font-size="21" fill="#25334d">2</text><text x="580" y="445" font-size="21" fill="#25334d">0</text><text x="720" y="445" font-size="17" fill="#25334d">该频带输出被抑制</text><text x="35" y="508" font-size="20" fill="#25334d">权重为0只说明估计器抑制了该带，不能独立证明神经活动为0。</text><text x="35" y="538" font-size="18" fill="#25334d">功率数值为本站假设；实际处理还需要检查噪声估计和输出偏差。</text></g></svg>