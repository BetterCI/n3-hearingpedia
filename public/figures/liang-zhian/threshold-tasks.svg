<svg xmlns="http://www.w3.org/2000/svg" width="960" height="590" viewBox="0 0 960 590" role="img"><title>感受阈、辨别阈与1997年单耳相位任务</title><rect width="960" height="590" fill="white"/><g font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="35" y="45" font-size="29" fill="#25334d">听得到、辨别得出、产生电位：三个问题</text><text x="35" y="80" font-size="18" fill="#9b5a2b">本站教学图｜500 pps与60°来自1997年原文，其余为解释性示意</text><rect x="35" y="115" width="280" height="130" rx="13" fill="#f4f7fc" stroke="#d4deec"/><text x="52" y="150" font-size="26" fill="#315bc6">感受</text><text x="52" y="189" font-size="18" fill="#25334d">声音是否存在？</text><text x="52" y="225" font-size="18" fill="#25334d">改变声级</text><rect x="340" y="115" width="280" height="130" rx="13" fill="#f4f7fc" stroke="#d4deec"/><text x="357" y="150" font-size="26" fill="#315bc6">辨别</text><text x="357" y="189" font-size="18" fill="#25334d">连续声是否发生变化？</text><text x="357" y="225" font-size="18" fill="#25334d">改变频率、振幅或相位</text><rect x="645" y="115" width="280" height="130" rx="13" fill="#f4f7fc" stroke="#d4deec"/><text x="662" y="150" font-size="26" fill="#315bc6">电生理</text><text x="662" y="189" font-size="18" fill="#25334d">变化是否诱发可辨认电位？</text><text x="662" y="225" font-size="18" fill="#25334d">规定响应判据</text><text x="35" y="290" font-size="25" fill="#25334d">单耳重复短声中的脉冲对</text><text x="35" y="324" font-size="19" fill="#25334d">每2 ms重复一对；P1固定，P2的延迟可变</text><path d="M190 390L900 390" stroke="#9caabe" stroke-width="2" fill="none"/><text x="35" y="396" font-size="21" fill="#315bc6">基准：60°</text><path d="M210 390L210 355" stroke="#25334d" stroke-width="2" fill="none"/><text x="198" y="348" font-size="16" fill="#25334d">P1</text><path d="M248.29500000000002 390L248.29500000000002 355" stroke="#315bc6" stroke-width="2" fill="none"/><text x="238.29500000000002" y="348" font-size="16" fill="#315bc6">P2</text><path d="M440 390L440 355" stroke="#25334d" stroke-width="2" fill="none"/><text x="428" y="348" font-size="16" fill="#25334d">P1</text><path d="M478.295 390L478.295 355" stroke="#315bc6" stroke-width="2" fill="none"/><text x="468.295" y="348" font-size="16" fill="#315bc6">P2</text><path d="M670 390L670 355" stroke="#25334d" stroke-width="2" fill="none"/><text x="658" y="348" font-size="16" fill="#25334d">P1</text><path d="M708.295 390L708.295 355" stroke="#315bc6" stroke-width="2" fill="none"/><text x="698.295" y="348" font-size="16" fill="#315bc6">P2</text><path d="M190 460L900 460" stroke="#9caabe" stroke-width="2" fill="none"/><text x="35" y="466" font-size="21" fill="#b66b2d">示意：90°</text><path d="M210 460L210 425" stroke="#25334d" stroke-width="2" fill="none"/><text x="198" y="418" font-size="16" fill="#25334d">P1</text><path d="M267.5 460L267.5 425" stroke="#b66b2d" stroke-width="2" fill="none"/><text x="257.5" y="418" font-size="16" fill="#b66b2d">P2</text><path d="M440 460L440 425" stroke="#25334d" stroke-width="2" fill="none"/><text x="428" y="418" font-size="16" fill="#25334d">P1</text><path d="M497.5 460L497.5 425" stroke="#b66b2d" stroke-width="2" fill="none"/><text x="487.5" y="418" font-size="16" fill="#b66b2d">P2</text><path d="M670 460L670 425" stroke="#25334d" stroke-width="2" fill="none"/><text x="658" y="418" font-size="16" fill="#25334d">P1</text><path d="M727.5 460L727.5 425" stroke="#b66b2d" stroke-width="2" fill="none"/><text x="717.5" y="418" font-size="16" fill="#b66b2d">P2</text><text x="35" y="510" font-size="20" fill="#25334d">这是一个耳机内两组脉冲的相对时间，不是左右耳之间的时间差。</text><text x="35" y="552" font-size="20" fill="#25334d">周期2 ms：ΔT = Δφ / (360 × 500)；1°相位约对应5.56 μs。</text></g></svg>