name: Verify and deploy Hearingpedia
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 1,7,13,19 * * *'

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      SITE_URL: https://betterci.github.io
      BASE_PATH: /n3-hearingpedia
      ASTRO_TELEMETRY_DISABLED: "1"
      PUBLIC_GOATCOUNTER_SITE: ${{ github.event_name != 'pull_request' && vars.GOATCOUNTER_SITE || '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: node --test scripts/fetch-visitor-stats.test.mjs scripts/baidu-visitor-stats.test.mjs scripts/visitor-stats-ui.test.mjs scripts/concept-publication.test.mjs
      - name: Restore encrypted Baidu OAuth state
        if: github.event_name != 'pull_request'
        uses: actions/cache/restore@v4
        with:
          path: .cache/baidu-oauth.enc
          key: baidu-oauth-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: baidu-oauth-v1-
      - name: Fetch public visitor summary
        if: github.event_name != 'pull_request'
        env:
          GOATCOUNTER_API_TOKEN: ${{ secrets.GOATCOUNTER_API_TOKEN }}
          BAIDU_ACCESS_TOKEN: ${{ secrets.BAIDU_ACCESS_TOKEN }}
          BAIDU_REFRESH_TOKEN: ${{ secrets.BAIDU_REFRESH_TOKEN }}
          BAIDU_API_KEY: ${{ secrets.BAIDU_API_KEY }}
          BAIDU_SECRET_KEY: ${{ secrets.BAIDU_SECRET_KEY }}
        run: node scripts/fetch-visitor-stats.mjs
      - name: Save encrypted Baidu OAuth state
        if: always() && github.event_name != 'pull_request' && hashFiles('.cache/baidu-oauth.enc') != ''
        uses: actions/cache/save@v4
        with:
          path: .cache/baidu-oauth.enc
          key: baidu-oauth-v1-${{ github.run_id }}-${{ github.run_attempt }}
      - run: pnpm build
      - run: pnpm verify
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: dist
  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Publish site
        id: deployment
        uses: actions/deploy-pages@v4
